services:
  - type: web
    name: toxictech-md
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SESSION
        sync: false
      - key: DEVICE
        value: default
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "20084"
